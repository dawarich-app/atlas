name: Release on changelog

on:
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
      - '.github/workflows/release-on-changelog.yml'
  workflow_dispatch:

concurrency:
  group: release-on-changelog
  cancel-in-progress: false

jobs:
  test-phoenix:
    uses: ./.github/workflows/test-phoenix.yml
  test-config:
    uses: ./.github/workflows/test-config.yml
  verify-images:
    uses: ./.github/workflows/build-app.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: false
  release:
    if: github.ref == 'refs/heads/main'
    needs: [test-phoenix, test-config, verify-images]
    name: Tag & release if new version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      # Needed to dispatch build-app.yml — see the last step.
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Parse top version from CHANGELOG.md
        id: parse
        run: node script/release-notes.cjs CHANGELOG.md app-phoenix/mix.exs /tmp/release-body.md

      - name: Check tag existence
        if: steps.parse.outputs.skip == 'false'
        id: exists
        env:
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "$(git rev-parse "${TAG}^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "Tag ${TAG} belongs to an earlier commit; leave that release unchanged."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.parse.outputs.skip == 'false' && steps.exists.outputs.exists == 'false'
        env:
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub release
        if: steps.parse.outputs.skip == 'false' && steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          set -euo pipefail
          # Recover a run interrupted after tagging or creating the release.
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --verify-tag \
              --title "${TAG}" --notes-file /tmp/release-body.md
          fi

      - name: Build the release image
        if: steps.parse.outputs.skip == 'false' && steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          # The release above was created with GITHUB_TOKEN, and GitHub does not
          # raise workflow-triggering events for anything GITHUB_TOKEN does — so
          # build-app.yml never sees a `release` event from it. workflow_dispatch
          # is the documented exception to that rule, so trigger it by hand.
          gh workflow run build-app.yml --ref "${TAG}" -f publish=true
