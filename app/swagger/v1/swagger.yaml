---
openapi: 3.0.3
info:
  title: Dawarich Atlas API
  version: v1
  description: Local-first geocoding, routing, transit, and POI lookup. All endpoints aggregate
    one or more upstream OSM-derived services (Photon, Placeholder, libpostal, Valhalla,
    Overpass).
servers:
- url: "{scheme}://{host}"
  variables:
    scheme:
      default: http
      enum:
      - http
      - https
    host:
      default: localhost:8484
paths:
  "/api/v1/geocode":
    get:
      summary: Combined forward + reverse geocoding
      tags:
      - Geocoding
      description: |
        Unified entrypoint that auto-routes to forward or reverse:

        * `?q=…` (with optional `lat,lon` for proximity bias) → forward search.
        * `?lat=&lon=` only → reverse geocode.

        Internally calls the same orchestrators as `/api/v1/search` and `/api/v1/reverse`.
      parameters:
      - name: q
        in: query
        schema:
          type: string
        required: false
        example: Marienplatz
      - name: lat
        in: query
        schema:
          type: number
          format: double
        required: false
        example: 48.1374
      - name: lon
        in: query
        schema:
          type: number
          format: double
        required: false
        example: 11.5755
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 25
          default: 8
        required: false
      - name: lang
        in: query
        schema:
          type: string
        required: false
      responses:
        '200':
          description: reverse result
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GeocodeResponse"
              examples:
                complete_forward_result:
                  $ref: "#/components/examples/GeocodeResponse"
        '400':
          description: neither q nor lat/lon supplied
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/reverse/batch":
    post:
      summary: Batch reverse geocoding (cached, grid-snapped)
      tags:
      - Geocoding
      description: |
        Reverse-geocode many coordinates in one round trip.

        * **Coords are snapped to a ~11 m grid** (4 decimal places) when computing the cache key,
          so repeated lookups of points within ~11 m of each other share a result.
        * **Solid Cache** (Rails 8 default) memoizes results for 30 days — dawarich-style trip
          replays after the first run hit cache nearly 100%.
        * Hard cap: 500 coords per request. For larger inputs, page client-side.
        * Each result preserves the caller's optional `id` so clients can correlate.
      parameters: []
      responses:
        '200':
          description: batch results
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BatchReverseResponse"
              examples:
                complete_batch_result:
                  $ref: "#/components/examples/BatchReverseResponse"
        '400':
          description: missing or invalid coords array
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: non-numeric coordinate inside payload
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/BatchReverseRequest"
            examples:
              complete_request:
                $ref: "#/components/examples/BatchReverseRequest"
  "/api/v1/reverse":
    get:
      summary: Reverse geocoding (point → labeled feature + admin chain)
      tags:
      - Geocoding
      description: |
        Sequential pipeline:
        1. **Photon** reverse → nearest labeled feature + its own admin tags.
        2. **Placeholder** fills in missing admin chain when Photon's tags are thin.
      parameters:
      - name: lat
        in: query
        schema:
          type: number
          format: double
        required: true
        example: 52.5163
      - name: lon
        in: query
        schema:
          type: number
          format: double
        required: true
        example: 13.3777
      - name: lang
        in: query
        schema:
          type: string
        required: false
        example: de
      responses:
        '200':
          description: feature returned (may be null if no nearby OSM feature)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReverseResponse"
              examples:
                complete_result:
                  $ref: "#/components/examples/ReverseResponse"
        '400':
          description: missing coordinates
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/route":
    get:
      summary: Routing via Valhalla (multimodal)
      tags:
      - Routing
      description: Single-source endpoint — Valhalla returns a turn-by-turn route,
        summary, and (optional) elevation profile.
      parameters:
      - name: from
        in: query
        schema:
          type: string
          pattern: "^-?\\d+(\\.\\d+)?,-?\\d+(\\.\\d+)?$"
        required: true
        example: 52.5163,13.3777
        description: lat,lon
      - name: to
        in: query
        schema:
          type: string
          pattern: "^-?\\d+(\\.\\d+)?,-?\\d+(\\.\\d+)?$"
        required: true
        example: 48.1374,11.5755
        description: lat,lon
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - auto
          - bicycle
          - pedestrian
          default: auto
        required: false
      responses:
        '200':
          description: route returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RouteResponse"
              examples:
                complete_result:
                  $ref: "#/components/examples/RouteResponse"
        '503':
          description: Valhalla unreachable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/search":
    get:
      summary: Forward geocoding (autocomplete + admin enrichment)
      tags:
      - Geocoding
      description: |
        Sequential pipeline:
        1. **libpostal** normalizes the query.
        2. **Photon** returns ranked candidates.
        3. **Placeholder** fills in missing admin chain (country / state / city) per candidate.

        Returns gracefully when Photon is down: `data: []`, `meta.upstream: "unavailable"`.
      parameters:
      - name: q
        in: query
        schema:
          type: string
        required: true
        example: Marienplatz
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 25
          default: 8
        required: false
      - name: lang
        in: query
        schema:
          type: string
        required: false
        example: de
      - name: lat
        in: query
        schema:
          type: number
          format: double
        required: false
        description: Optional proximity bias
      - name: lon
        in: query
        schema:
          type: number
          format: double
        required: false
      responses:
        '200':
          description: results returned (possibly empty)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SearchResponse"
              examples:
                complete_result:
                  $ref: "#/components/examples/SearchResponse"
        '400':
          description: missing q parameter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/whats-here":
    get:
      summary: Reverse + nearby POIs in a radius
      tags:
      - POIs
      description: |
        Combines `ReverseOrchestrator` (Photon reverse + Placeholder admin enrichment) with an
        Overpass radius query so a single call answers “what is at and around this point”.
      parameters:
      - name: lat
        in: query
        schema:
          type: number
          format: double
        required: true
        example: 52.5163
      - name: lon
        in: query
        schema:
          type: number
          format: double
        required: true
        example: 13.3777
      - name: radius
        in: query
        schema:
          type: integer
          minimum: 10
          maximum: 2000
          default: 200
        required: false
      - name: lang
        in: query
        schema:
          type: string
        required: false
      responses:
        '200':
          description: label + nearby POIs
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WhatsHereResponse"
              examples:
                complete_result:
                  $ref: "#/components/examples/WhatsHereResponse"
        '400':
          description: missing coordinates
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/map-match":
    post:
      summary: Snap a recorded GPS trace onto the road network
      tags:
      - Routing
      description: >-
        Returns every matched segment and one correlation result per input
        point. Supply timestamps and accuracy when available. GeoJSON uses a
        MultiLineString when the trace contains discontinuities. Directions
        are optional because they require a second Valhalla request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MapMatchRequest"
            examples:
              complete_request:
                $ref: "#/components/examples/MapMatchRequest"
      responses:
        '200':
          description: matched trace
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MapMatchResponse"
              examples:
                polyline_legs:
                  $ref: "#/components/examples/MapMatchPolylineResponse"
                decoded_geojson:
                  $ref: "#/components/examples/MapMatchGeoJsonResponse"
        '400':
          description: missing shape
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: invalid or unmatchable trace
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '429':
          description: map matching capacity reached; retry later
          headers:
            Retry-After:
              schema: {type: integer}
              description: Suggested delay in seconds before retrying.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/transit":
    get:
      summary: Plan a public-transport journey
      tags:
      - Transit
      description: Uses the selected transit engine (MOTIS by default, or OpenTripPlanner).
        The normalized Atlas response has the same shape for both engines.
      parameters:
      - name: from
        in: query
        required: true
        description: Origin as lat,lon
        schema:
          type: string
        example: 52.4884,13.4703
      - name: to
        in: query
        required: true
        description: Destination as lat,lon
        schema:
          type: string
        example: 52.5073,13.3324
      - name: time
        in: query
        required: false
        description: ISO 8601 departure or arrival time
        schema:
          type: string
          format: date-time
        example: '2026-09-07T08:00:00Z'
      - name: modes
        in: query
        required: false
        schema:
          type: string
        example: TRANSIT,WALK
      - name: num
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 6
        example: 3
      - name: arrive_by
        in: query
        required: false
        schema:
          type: boolean
        example: false
      responses:
        '200':
          description: transit plan
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransitResponse"
              examples:
                complete_result:
                  $ref: "#/components/examples/TransitResponse"
        '400':
          description: missing from or to
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: invalid endpoint
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/pois":
    get:
      summary: List points of interest in a bounding box
      tags:
      - POIs
      parameters:
      - name: bbox
        in: query
        required: true
        description: south,west,north,east
        schema:
          type: string
        example: 52.50,13.36,52.54,13.42
      - name: types
        in: query
        required: false
        schema:
          type: string
        example: cafe,restaurant
      - name: q
        in: query
        required: false
        schema:
          type: string
        example: breakfast
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
        example: 100
      - name: lang
        in: query
        required: false
        schema:
          type: string
        example: en
      responses:
        '200':
          description: matching POIs
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PoisResponse"
              examples:
                complete_result:
                  $ref: "#/components/examples/PoisResponse"
        '400':
          description: missing bbox
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: invalid bbox or categories
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/pois/categories":
    get:
      summary: List the POI category catalog
      tags:
      - POIs
      responses:
        '200':
          description: category sections and items
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PoiCategoriesResponse"
              examples:
                complete_result:
                  $ref: "#/components/examples/PoiCategoriesResponse"
  "/api/v1/version":
    get:
      summary: Return the running Atlas version and revision
      tags:
      - System
      responses:
        '200':
          description: version information
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VersionResponse"
              examples:
                complete_result:
                  $ref: "#/components/examples/VersionResponse"
  "/api/v1/health":
    get:
      summary: Return health for each public capability
      tags:
      - System
      responses:
        '200':
          description: capability health
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HealthResponse"
              examples:
                complete_result:
                  $ref: "#/components/examples/HealthResponse"
  "/api/v1/photon/api":
    get:
      summary: Raw Photon forward-geocoding passthrough
      tags:
      - Photon passthrough
      description: Compatibility endpoint. Query parameters are forwarded to Photon unchanged.
      responses:
        '200':
          description: Photon GeoJSON FeatureCollection
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotonFeatureCollection"
              examples:
                complete_result:
                  $ref: "#/components/examples/PhotonFeatureCollection"
  "/api/v1/photon/reverse":
    get:
      summary: Raw Photon reverse-geocoding passthrough
      tags:
      - Photon passthrough
      responses:
        '200':
          description: Photon GeoJSON FeatureCollection
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotonFeatureCollection"
              examples:
                complete_result:
                  $ref: "#/components/examples/PhotonFeatureCollection"
  "/api/v1/photon/lookup":
    get:
      summary: Raw Photon lookup-by-OSM-id passthrough
      tags:
      - Photon passthrough
      responses:
        '200':
          description: Photon GeoJSON FeatureCollection
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhotonFeatureCollection"
              examples:
                complete_result:
                  $ref: "#/components/examples/PhotonFeatureCollection"
  "/api/v1/photon/status":
    get:
      summary: Raw Photon status passthrough
      tags:
      - Photon passthrough
      responses:
        '200':
          description: Photon status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                complete_result:
                  $ref: "#/components/examples/PhotonStatusResponse"
components:
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              type: object
              additionalProperties: true
      example:
        error:
          code: VALIDATION_ERROR
          message: bbox must be 's,w,n,e'
          details:
            param: bbox
    Coords:
      type: object
      required:
      - lat
      - lon
      properties:
        lat:
          type: number
          format: double
          example: 52.52
        lon:
          type: number
          format: double
          example: 13.405
    AdminHierarchy:
      type: object
      properties:
        country:
          type: string
          nullable: true
          example: Germany
        state:
          type: string
          nullable: true
          example: Berlin
        county:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
          example: Berlin
        postcode:
          type: string
          nullable: true
    GeocodeFeature:
      type: object
      required:
      - id
      - label
      - coords
      properties:
        id:
          type: string
          example: node:240109189
        name:
          type: string
          nullable: true
          example: Berlin
        label:
          type: string
          example: Berlin, Germany
        type:
          type: string
          nullable: true
          example: city
        coords:
          "$ref": "#/components/schemas/Coords"
        admin:
          "$ref": "#/components/schemas/AdminHierarchy"
        address:
          type: object
          properties:
            house_number: {type: string, nullable: true}
            street: {type: string, nullable: true}
            city: {type: string, nullable: true}
            county: {type: string, nullable: true}
            state: {type: string, nullable: true}
            postcode: {type: string, nullable: true}
            country: {type: string, nullable: true}
            countrycode: {type: string, nullable: true}
        match_type:
          type: string
          enum: [rooftop, street, locality, region, country, unknown]
        confidence:
          type: number
          nullable: true
    ResponseMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-09-06T20:53:10Z'
        upstream:
          type: string
          example: ok
        count:
          type: integer
          example: 5
    SearchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/GeocodeFeature"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    ReverseResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            here:
              "$ref": "#/components/schemas/GeocodeFeature"
              nullable: true
            admin:
              "$ref": "#/components/schemas/AdminHierarchy"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    BatchReverseRequest:
      type: object
      required:
      - coords
      properties:
        coords:
          type: array
          maxItems: 500
          items:
            type: object
            required:
            - lat
            - lon
            properties:
              id:
                type: string
                nullable: true
                example: p_42
              lat:
                type: number
                format: double
                example: 52.5163
              lon:
                type: number
                format: double
                example: 13.3777
        lang:
          type: string
          nullable: true
          example: de
    BatchReverseResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                nullable: true
              coord:
                "$ref": "#/components/schemas/Coords"
              here:
                "$ref": "#/components/schemas/GeocodeFeature"
                nullable: true
              admin:
                "$ref": "#/components/schemas/AdminHierarchy"
              error:
                type: string
                nullable: true
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            properties:
              cache_hits:
                type: integer
                example: 184
              cache_misses:
                type: integer
                example: 16
              upstream_errors:
                type: integer
                example: 0
              grid_precision:
                type: integer
                example: 4
                description: Decimal places used for cache-key snapping (4 ≈ 11 m)
              max_coords:
                type: integer
                example: 500
    WhatsHereResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            here:
              "$ref": "#/components/schemas/GeocodeFeature"
              nullable: true
            admin:
              "$ref": "#/components/schemas/AdminHierarchy"
            nearby:
              type: array
              items:
                "$ref": "#/components/schemas/PoiFeature"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    RouteResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            summary:
              type: object
            legs:
              type: array
              items:
                type: object
            shape_format:
              type: string
              example: valhalla_encoded_polyline6
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    GeocodeResponse:
      type: object
      description: Union of forward and reverse responses depending on which params
        are supplied.
      properties:
        data:
          oneOf:
          - type: array
            items:
              "$ref": "#/components/schemas/GeocodeFeature"
          - type: object
            properties:
              here:
                "$ref": "#/components/schemas/GeocodeFeature"
                nullable: true
              admin:
                "$ref": "#/components/schemas/AdminHierarchy"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    MapMatchRequest:
      type: object
      required: [shape]
      properties:
        shape:
          type: array
          minItems: 2
          items:
            type: object
            required: [lat, lon]
            properties:
              lat: {type: number, format: double}
              lon: {type: number, format: double}
              time: {type: integer, description: Epoch seconds}
              accuracy: {type: number, description: Accuracy in metres}
        mode: {type: string, enum: [auto, bicycle, pedestrian]}
        shape_match: {type: string, enum: [map_snap, walk_or_snap, edge_walk]}
        format: {type: string, enum: [polyline6, geojson]}
        include_directions:
          type: boolean
          default: false
          description: Include narrative paths using an additional trace_route request.
        search_radius: {type: number}
        gps_accuracy: {type: number}
        breakage_distance: {type: number}
    MapMatchResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            summary:
              type: object
              properties:
                length: {type: number, description: Total matched length in kilometres}
                time: {type: number, description: Total estimated traversal time in seconds}
            matched_points:
              type: array
              items: {$ref: "#/components/schemas/MapMatchedPoint"}
            stats: {$ref: "#/components/schemas/MapMatchStats"}
            legs:
              type: array
              description: Matched segments encoded as Valhalla polyline6; present for format=polyline6.
              items:
                type: object
                properties:
                  shape: {type: string}
                  summary: {type: object}
            geometry:
              description: Present for format=geojson. Discontinuous matches use MultiLineString.
              oneOf:
              - type: object
                properties:
                  type: {type: string, enum: [LineString]}
                  coordinates: {type: array, items: {type: array, items: {type: number}}}
              - type: object
                properties:
                  type: {type: string, enum: [MultiLineString]}
                  coordinates:
                    type: array
                    items: {type: array, items: {type: array, items: {type: number}}}
            segments:
              type: array
              description: Independently drawable GeoJSON segments; present for format=geojson.
              items: {$ref: "#/components/schemas/MapMatchSegment"}
            directions:
              type: object
              description: Present only when include_directions=true.
              properties:
                paths: {type: array, items: {type: object}}
            shape_format: {type: string, enum: [valhalla_encoded_polyline6, geojson]}
        meta:
          type: object
          properties:
            timestamp: {type: string, format: date-time}
            mode: {type: string}
            shape_match: {type: string}
            format: {type: string}
            include_directions: {type: boolean}
            points: {type: integer}
            max_points: {type: integer}
    MapMatchedPoint:
      type: object
      properties:
        input_index: {type: integer}
        lat: {type: number, format: double, nullable: true}
        lon: {type: number, format: double, nullable: true}
        type: {type: string, enum: [matched, interpolated, unmatched]}
        edge_index: {type: integer, nullable: true}
        distance_along_edge: {type: number, nullable: true}
        distance_from_trace_point:
          type: number
          nullable: true
          description: Distance from the recorded point to its road match in metres.
    MapMatchStats:
      type: object
